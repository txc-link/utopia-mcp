services:
  utopia-mcp:
    build: /opt/utopia-mcp
    image: utopia-mcp:0.3.0
    container_name: utopia-mcp
    restart: unless-stopped
    env_file:
      - /opt/utopia-mcp/adapter.env
    environment:
      PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18426:8080"     # 内部端口；对外由 Caddy 在 18425 提供 TLS
    networks:
      - default
      - tdai-memory-stack

networks:
  tdai-memory-stack:
    external: true
